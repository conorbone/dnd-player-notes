site_name: DnD Player Notes
site_url: https://dnd.raccoon.id

theme:
  name: material
  palette:
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - search.suggest

plugins:
  - search
  - roamlinks
  - obsidian-support
  - mkdocs-pdf

# Extensions
markdown_extensions:
  - footnotes
  - attr_list
  - toc:
      permalink: true
